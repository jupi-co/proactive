<svg xmlns="http://www.w3.org/2000/svg" width="680" height="526" viewBox="0 0 680 526" role="img">
<title>The five Neon tables and how the routines use them</title>
<desc>Neon holds five tables: tasks and actions (act-and-decide only); crawl_state, crawl_frontier and routine_runs (used by both routines). On the act-and-decide side, refresh-backlog writes tasks, act-or-decide reads N tasks and writes actions. On the refresh-brain side, update-brain reads crawl_state as its cursor and drains crawl_frontier, then writes Facts to Supermemory.</desc>
<style>
  .th{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:14px;fill:#2C2C2A}
  .ts{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:12px;fill:#5F5E5A}
  .teal{fill:#E1F5EE;stroke:#0F6E56}
  .purple{fill:#EEEDFE;stroke:#534AB7}
  .box{fill:#FFFFFF;stroke:#B4B2A9}
  .pill{fill:#FFFFFF;stroke:#888780}
  .tab{fill:#FFFFFF;stroke:#888780}
  .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
  .darr{stroke:#888780;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
  .dash{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:6 4}
  .bg{fill:#FCFCFA;stroke:#E7E5DE}
</style>
