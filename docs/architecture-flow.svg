<svg xmlns="http://www.w3.org/2000/svg" width="680" height="690" viewBox="0 0 680 690" role="img">
<title>Proactive-Jupi plugin flow</title>
<desc>Two scheduled routines. Refresh-brain runs update-brain, writing Facts to Supermemory. Act-and-decide runs refresh-backlog (tasks into Neon), act-or-decide (reads N tasks and Facts, writes actions back to Neon, then hands one to execute-action or raises a decision in Jupi), act-post-decision, and execute-action (performs the side-effect on your tools). Boxes say what each does; arrows are labelled with the entity that flows.</desc>
<style>
  .th{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:500;font-size:14px;fill:#2C2C2A}
  .ts{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:12px;fill:#5F5E5A}
  .teal{fill:#E1F5EE;stroke:#0F6E56}
  .purple{fill:#EEEDFE;stroke:#534AB7}
  .gray{fill:#F1EFE8;stroke:#5F5E5A}
  .tab{fill:#FFFFFF;stroke:#888780}
  .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
  .darr{stroke:#888780;stroke-width:1.5;fill:none;stroke-dasharray:4 3}
  .dash{fill:none;stroke:#888780;stroke-width:1;stroke-dasharray:6 4}
  .bg{fill:#FCFCFA;stroke:#E7E5DE}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect class="bg" x="1" y="1" width="678" height="688" rx="16"/>

<rect class="dash" x="28" y="104" width="176" height="98" rx="14"/>
<rect class="dash" x="214" y="104" width="270" height="470" rx="14"/>
<rect class="tab" x="28" y="98" width="140" height="22" rx="6"/>
<text class="th" x="98" y="109" text-anchor="middle" dominant-baseline="central">refresh-brain</text>
<rect class="tab" x="214" y="98" width="126" height="22" rx="6"/>
<text class="th" x="277" y="109" text-anchor="middle" dominant-baseline="central">act-&amp;-decide</text>

<line x1="349" y1="96" x2="349" y2="137" class="arr" marker-end="url(#arrow)"/>
<line x1="349" y1="192" x2="349" y2="211" class="arr" marker-end="url(#arrow)"/>
<line x1="337" y1="266" x2="337" y2="285" class="arr" marker-end="url(#arrow)"/>
<line x1="349" y1="266" x2="349" y2="285" class="arr" marker-end="url(#arrow)"/>
<line x1="361" y1="266" x2="361" y2="285" class="arr" marker-end="url(#arrow)"/>
<path d="M280 340 L280 483" class="arr" marker-end="url(#arrow)"/>
<path d="M446 314 L504 326" class="arr" marker-end="url(#arrow)"/>
<path d="M573 352 L573 426 L473 426" class="arr" marker-end="url(#arrow)"/>
<line x1="385" y1="452" x2="385" y2="483" class="arr" marker-end="url(#arrow)"/>
<line x1="349" y1="538" x2="349" y2="581" class="arr" marker-end="url(#arrow)"/>
<line x1="116" y1="186" x2="116" y2="211" class="arr" marker-end="url(#arrow)"/>
<path d="M188 240 L208 240 L208 314 L252 314" class="darr" marker-end="url(#arrow)"/>
<path d="M444 296 L458 296 L458 240 L446 240" class="darr" marker-end="url(#arrow)"/>

<text class="ts" x="360" y="115" dominant-baseline="central">signals</text>
<text class="ts" x="360" y="204" dominant-baseline="central">tasks</text>
<text class="ts" x="374" y="276" dominant-baseline="central">N tasks</text>
<text class="ts" x="204" y="300" text-anchor="end" dominant-baseline="central">reads Facts</text>
<text class="ts" x="466" y="256" dominant-baseline="central">actions</text>
<text class="ts" x="266" y="410" text-anchor="end" dominant-baseline="central">action</text>
<text class="ts" x="470" y="302" text-anchor="middle" dominant-baseline="central">decision</text>
<text class="ts" x="535" y="414" text-anchor="middle" dominant-baseline="central">finalized decision</text>
<text class="ts" x="398" y="470" dominant-baseline="central">action</text>
<text class="ts" x="360" y="561" dominant-baseline="central">draft / send</text>
<text class="ts" x="130" y="200" dominant-baseline="central">Facts</text>

<rect class="gray" x="254" y="44" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="349" y="62" text-anchor="middle" dominant-baseline="central">Signals</text>
<text class="ts" x="349" y="79" text-anchor="middle" dominant-baseline="central">email · calendar</text>

<rect class="purple" x="254" y="140" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="349" y="158" text-anchor="middle" dominant-baseline="central">refresh-backlog</text>
<text class="ts" x="349" y="175" text-anchor="middle" dominant-baseline="central">parse + score</text>

<rect class="teal" x="254" y="214" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="349" y="232" text-anchor="middle" dominant-baseline="central">Neon backlog</text>
<text class="ts" x="349" y="249" text-anchor="middle" dominant-baseline="central">5 tables</text>

<rect class="purple" x="254" y="288" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="349" y="306" text-anchor="middle" dominant-baseline="central">act-or-decide</text>
<text class="ts" x="349" y="323" text-anchor="middle" dominant-baseline="central">cluster · gate</text>

<rect class="purple" x="300" y="400" width="170" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="385" y="418" text-anchor="middle" dominant-baseline="central">act-post-decision</text>
<text class="ts" x="385" y="435" text-anchor="middle" dominant-baseline="central">run settled actions</text>

<rect class="purple" x="254" y="486" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="349" y="504" text-anchor="middle" dominant-baseline="central">execute-action</text>
<text class="ts" x="349" y="521" text-anchor="middle" dominant-baseline="central">perform side-effect</text>

<rect class="gray" x="254" y="584" width="190" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="349" y="602" text-anchor="middle" dominant-baseline="central">Your tools</text>
<text class="ts" x="349" y="619" text-anchor="middle" dominant-baseline="central">Gmail · Linear · …</text>

<rect class="teal" x="506" y="300" width="134" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="573" y="318" text-anchor="middle" dominant-baseline="central">Jupi decision</text>
<text class="ts" x="573" y="335" text-anchor="middle" dominant-baseline="central">you finalize</text>

<rect class="purple" x="44" y="134" width="144" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="116" y="152" text-anchor="middle" dominant-baseline="central">update-brain</text>
<text class="ts" x="116" y="169" text-anchor="middle" dominant-baseline="central">read-only crawl</text>

<rect class="teal" x="44" y="214" width="144" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="116" y="232" text-anchor="middle" dominant-baseline="central">Supermemory</text>
<text class="ts" x="116" y="249" text-anchor="middle" dominant-baseline="central">Facts (brain)</text>

<rect class="purple" x="44" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="62" y="666">skill</text>
<rect class="teal" x="118" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="136" y="666">state store</text>
<rect class="gray" x="238" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="256" y="666">external / tool</text>
<rect class="dash" x="392" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="410" y="666">scheduled routine (daily, cloud)</text>
</svg>
